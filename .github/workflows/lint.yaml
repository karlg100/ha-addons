name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [unifi_network_mcp]
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant add-on linter
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.addon }}"
      - name: ShellCheck
        run: shellcheck ${{ matrix.addon }}/run.sh .github/scripts/*.sh

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the add-on the way HA runs it
        run: sh .github/scripts/smoke-test.sh
